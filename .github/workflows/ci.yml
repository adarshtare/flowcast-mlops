name: FlowCast CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest pandas xgboost scikit-learn

      - name: API Health Test
        run: |
          python -m py_compile src/api.py

      - name: Validate Training Script
        run: |
          python -m py_compile src/train.py

      - name: Validate Feature Pipeline
        run: |
          python -m py_compile src/features.py

      - name: CI Passed
        run: echo "FlowCast pipeline passed CI"
